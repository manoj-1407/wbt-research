name: "QEMU WBT Smoke Test — Boot & Tracepoint Validation"

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run ID of build-wbt-kernels to fetch artifacts from"
        required: true
        default: "39960651595"
  push:
    paths:
      - ".github/workflows/qemu-wbt-smoke-test.yml"

permissions:
  contents: write

jobs:
  qemu-smoke-test:
    name: "QEMU Smoke Test: Boot, WBT sysfs, and Tracepoints"
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out research repo
        uses: actions/checkout@v4

      - name: Check runner capabilities & virtualization
        run: |
          echo "=== CPU Info ==="
          grep -m 1 'model name' /proc/cpuinfo || true
          echo "=== KVM availability ==="
          if [ -e /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM is available and writable: /dev/kvm"
            echo "ACCEL=-enable-kvm -cpu host" >> $GITHUB_ENV
          else
            echo "KVM not available; using TCG emulation: -accel tcg"
            echo "ACCEL=-accel tcg" >> $GITHUB_ENV
          fi

      - name: Install QEMU and userspace tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 busybox-static cpio

      - name: Download Baseline Artifact
        uses: actions/download-artifact@v4
        with:
          name: wbt-baseline-a07f9ea8a
          path: baseline_artifact
          run-id: ${{ github.event.inputs.build_run_id || '39960651595' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Patched Artifact
        uses: actions/download-artifact@v4
        with:
          name: wbt-patched-a07f9ea8a
          path: patched_artifact
          run-id: ${{ github.event.inputs.build_run_id || '39960651595' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect downloaded kernel binaries
        run: |
          echo "Baseline bzImage:"
          ls -lh baseline_artifact/kernel-src/arch/x86/boot/bzImage
          echo "Patched bzImage:"
          ls -lh patched_artifact/kernel-src/arch/x86/boot/bzImage

      - name: Build micro-initramfs for WBT trace validation
        run: |
          mkdir -p initramfs/{bin,sbin,dev,proc,sys,mnt,etc}
          cp /bin/busybox initramfs/bin/busybox
          
          # Populate essential BusyBox symlinks
          for cmd in sh ls cat echo mkdir mount umount dmesg sleep dd grep basename poweroff reboot; do
            ln -sf busybox "initramfs/bin/$cmd"
          done

          # Create /init script
          cat << 'EOF' > initramfs/init
          #!/bin/busybox sh
          export PATH=/bin:/sbin

          mount -t proc none /proc
          mount -t sysfs none /sys
          mount -t tracefs none /sys/kernel/tracing 2>/dev/null || mount -t debugfs none /sys/kernel/debug

          echo "=========================================="
          echo "=== [QEMU-WBT] KERNEL BOOT SUCCESSFUL ==="
          echo "=========================================="
          uname -a
          
          echo "--- Checking BLK_WBT config in /proc/config.gz ---"
          if [ -f /proc/config.gz ]; then
            zcat /proc/config.gz | grep BLK_WBT || echo "BLK_WBT not set in config.gz"
          else
            echo "/proc/config.gz not present (normal if not enabled)"
          fi

          echo "--- Block devices in /sys/block ---"
          ls -la /sys/block/

          TARGET_DEV=""
          for b in /sys/block/*; do
            bname=$(basename "$b")
            case "$bname" in
              loop*|ram*) continue ;;
              *) TARGET_DEV="$bname"; break ;;
            esac
          done

          if [ -n "$TARGET_DEV" ]; then
            echo "[+] Target disk detected: /dev/$TARGET_DEV"
            WBT_LAT_NODE="/sys/block/$TARGET_DEV/queue/wbt_lat_usec"
            if [ -f "$WBT_LAT_NODE" ]; then
              echo "[+] WBT sysfs node found: $WBT_LAT_NODE (current value: $(cat $WBT_LAT_NODE))"
              # Ensure WBT is enabled with standard 20ms target latency if not already active
              if [ "$(cat $WBT_LAT_NODE)" = "0" ] || [ "$(cat $WBT_LAT_NODE)" = "-1" ]; then
                echo "20000" > "$WBT_LAT_NODE" 2>/dev/null || echo "[-] Failed to write to wbt_lat_usec"
                echo "[+] Updated wbt_lat_usec to: $(cat $WBT_LAT_NODE)"
              fi
            else
              echo "[-] Warning: $WBT_LAT_NODE does NOT exist on /dev/$TARGET_DEV"
            fi
          else
            echo "[-] No physical/emulated disk found in /sys/block!"
          fi

          echo "--- Checking WBT Tracepoint directory ---"
          if [ -d /sys/kernel/tracing/events/wbt ]; then
            echo "[+] /sys/kernel/tracing/events/wbt exists!"
            ls /sys/kernel/tracing/events/wbt
            
            echo 0 > /sys/kernel/tracing/tracing_on
            echo "" > /sys/kernel/tracing/trace
            echo 1 > /sys/kernel/tracing/events/wbt/enable
            echo 1 > /sys/kernel/tracing/tracing_on
            echo "[+] WBT tracepoints armed."
          else
            echo "[-] Tracepoint directory /sys/kernel/tracing/events/wbt missing!"
          fi

          if [ -n "$TARGET_DEV" ]; then
            echo "--- Generating I/O Activity on /dev/$TARGET_DEV ---"
            # Write 20MB with fsync to force writeback through block layer
            dd if=/dev/zero of="/dev/$TARGET_DEV" bs=1M count=20 conv=fsync 2>&1
            sync
            # Read back blocks
            dd if="/dev/$TARGET_DEV" of=/dev/null bs=4k count=200 2>&1
            # Allow timer windows to expire (100ms window)
            sleep 2
          fi

          echo "=========================================="
          echo "=== [QEMU-WBT] CAPTURED TRACE BUFFER ==="
          echo "=========================================="
          if [ -f /sys/kernel/tracing/trace ]; then
            cat /sys/kernel/tracing/trace
          fi

          echo "=========================================="
          echo "=== [QEMU-WBT] SMOKE TEST COMPLETE ==="
          echo "=========================================="
          poweroff -f
          EOF

          chmod +x initramfs/init

          # Package initramfs
          cd initramfs
          find . | cpio -o -H newc | gzip -9 > ../initramfs.cpio.gz
          cd ..
          ls -lh initramfs.cpio.gz

      - name: Create virtual test disk
        run: |
          dd if=/dev/zero of=test_disk.img bs=1M count=128 status=progress

      - name: Run Smoke Test — Baseline Kernel
        run: |
          echo "Booting baseline kernel in QEMU..."
          timeout 120s qemu-system-x86_64 \
            $ACCEL \
            -m 1024 \
            -kernel baseline_artifact/kernel-src/arch/x86/boot/bzImage \
            -initrd initramfs.cpio.gz \
            -drive file=test_disk.img,format=raw,if=ide \
            -append "console=ttyS0 panic=1 quiet loglevel=3" \
            -nographic \
            -no-reboot 2>&1 | tee baseline_qemu.log || true

          echo "--- Checking Baseline Smoke Test Results ---"
          grep "KERNEL BOOT SUCCESSFUL" baseline_qemu.log || (echo "Baseline failed to boot!" && exit 1)
          grep "Target disk detected" baseline_qemu.log || true
          grep "wbt_lat_usec" baseline_qemu.log || true
          grep -E 'wbt_timer|wbt_step|wbt_stat' baseline_qemu.log || echo "Notice: No WBT trace events emitted yet"

      - name: Run Smoke Test — Patched Kernel
        run: |
          echo "Booting patched kernel in QEMU..."
          timeout 120s qemu-system-x86_64 \
            $ACCEL \
            -m 1024 \
            -kernel patched_artifact/kernel-src/arch/x86/boot/bzImage \
            -initrd initramfs.cpio.gz \
            -drive file=test_disk.img,format=raw,if=ide \
            -append "console=ttyS0 panic=1 quiet loglevel=3" \
            -nographic \
            -no-reboot 2>&1 | tee patched_qemu.log || true

          echo "--- Checking Patched Smoke Test Results ---"
          grep "KERNEL BOOT SUCCESSFUL" patched_qemu.log || (echo "Patched failed to boot!" && exit 1)
          grep "Target disk detected" patched_qemu.log || true
          grep "wbt_lat_usec" patched_qemu.log || true
          grep -E 'wbt_timer|wbt_step|wbt_stat' patched_qemu.log || echo "Notice: No WBT trace events emitted yet"

      - name: Display and record smoke test results
        run: |
          mkdir -p benchmarks/smoke_test
          cp baseline_qemu.log benchmarks/smoke_test/
          cp patched_qemu.log benchmarks/smoke_test/

          echo "## Baseline Kernel QEMU Smoke Test Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat baseline_qemu.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "## Patched Kernel QEMU Smoke Test Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat patched_qemu.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "=================== BASELINE LOG ==================="
          cat baseline_qemu.log
          echo "=================== PATCHED LOG ==================="
          cat patched_qemu.log

      - name: Commit smoke test logs to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/smoke_test/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(ci): record smoke test boot logs from QEMU [skip ci]"
            git push origin main
          fi

      - name: Upload QEMU smoke test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-smoke-test-logs
          retention-days: 14
          path: |
            baseline_qemu.log
            patched_qemu.log
