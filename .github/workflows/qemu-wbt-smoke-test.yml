name: "QEMU WBT Matched Benchmark — Guard Audit (IDE QD=1 vs virtio-scsi deep queue)"

# ---------------------------------------------------------------------------
# Design notes (v3)
# ---------------------------------------------------------------------------
# ROOT CAUSE FIXED IN THIS REVISION — zero trace events in run 39996857389
# -------------------------------------------------------------------------
# v2 issued every write as `dd ... oflag=direct` (O_DIRECT). In the pinned
# kernel (block/blk-wbt.c @ a07f9ea8a99139913acbcc1c160b132cb2a49c81):
#
#   wbt_should_throttle():  case REQ_OP_WRITE:
#       if ((bio->bi_opf & (REQ_SYNC | REQ_IDLE)) == (REQ_SYNC | REQ_IDLE))
#               return false;      /* "Don't throttle WRITE_ODIRECT" */
#
#   bio_to_wbt_flags():     WBT_TRACKED is only set when wbt_should_throttle()
#   wbt_wait():             rwb_arm_timer() is called HERE AND NOWHERE ELSE
#                           (wbt_done() does not arm it; wbt_init() does not
#                            arm it), and only for WBT_TRACKED bios.
#
# O_DIRECT writes carry REQ_SYNC|REQ_IDLE, so they are exempt -> never
# WBT_TRACKED -> wbt_wait() is never called -> the WBT window timer is never
# armed -> blk_stat_is_active() stays false -> latency_exceeded() never runs
# -> wbt_timer = wbt_step = wbt_stat = wbt_lat = wbt_guard = 0. That is
# exactly the null result observed in all six v2 configurations, on baseline
# and patched kernels alike.
#
# v3 therefore splits the two roles by what each one must actually do:
#   * WRITES must be BUFFERED (page-cache + fsync) so REQ_OP_WRITE bios without
#     REQ_IDLE are submitted and WBT tracks/throttles them. Implemented as a
#     purpose-built static binary (benchmarks/wbt_writer.c) because BusyBox
#     dd's direct-I/O semantics are both irrelevant and untestable here.
#   * READS stay O_DIRECT (reads are never throttled by WBT, but they are
#     *accounted* into cb->stat[READ], which is the guard's input; buffered
#     reads would be served from page cache and never reach the block layer).
#
# Earlier defects retained from v2:
#   (a) /tmp was never created (writer looped until the QEMU timeout).
#   (b) `if=ide` gives QD==1 and rq_depth collapses, so the guard has no depth
#       lever -> kept deliberately as the inertness control.
#   (c) trace buffer enlarged; probe timing overflow fixed.
#   (d) artifact provenance + wbt_guard symbol gate before benchmarking.
#
# This revision runs the SAME kernel binaries under a 2x2x2 matrix:
#   device: ide (QD==1, no lever) | virtio-scsi num_queues=1 (deep queue)
#   build : baseline               | patched (guard + wbt_guard tracepoint)
#   load  : heavy (4 buffered writers, 2 readers, target 1ms)
#           sparse (1 slow buffered writer, 6 readers, target 150us)
#           -- only the sparse profile can reach LAT_UNKNOWN_WRITES, i.e. the
#              single branch the patch modifies (stat_sample_valid() false,
#              which needs < 3 write completions per 100ms window).
# Every configuration also reports /sys/block/<dev>/stat before/after so the
# run proves by itself that writes actually reached the block layer.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run ID of build-wbt-kernels to fetch kernel artifacts from"
        required: true
        default: "39987714631"
      wbt_lat_usec_heavy:
        description: "WBT target latency for the heavy mixed profile (microseconds)"
        required: true
        default: "1000"
      wbt_lat_usec_sparse:
        description: "WBT target latency for the read-dominated sparse-writer profile (microseconds)"
        required: true
        default: "150"
      reader_seconds:
        description: "Duration of the foreground read probe (seconds)"
        required: true
        default: "30"

permissions:
  contents: write
  actions: read

jobs:
  qemu-benchmark:
    name: "QEMU Benchmark: Matched Concurrent Read/Write & Guard Audit"
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    env:
      WBT_LAT_HEAVY: ${{ inputs.wbt_lat_usec_heavy }}
      WBT_LAT_SPARSE: ${{ inputs.wbt_lat_usec_sparse }}
      READER_SECONDS: ${{ inputs.reader_seconds }}

    steps:
      - name: Check out research repo
        uses: actions/checkout@v4

      - name: Check runner capabilities & virtualization
        run: |
          echo "=== CPU Info ==="
          grep -m 1 'model name' /proc/cpuinfo || true
          echo "=== KVM availability ==="
          if [ -e /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM is available and writable: /dev/kvm"
            echo "ACCEL=-enable-kvm -cpu host" >> $GITHUB_ENV
          else
            echo "KVM not available; using TCG emulation: -accel tcg"
            echo "ACCEL=-accel tcg" >> $GITHUB_ENV
          fi

      - name: Install QEMU and userspace tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 busybox-static cpio build-essential
          qemu-system-x86_64 --version | head -1

      - name: Download Baseline Artifact
        uses: actions/download-artifact@v4
        with:
          pattern: wbt-baseline-*
          path: baseline_artifact
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Download Patched Artifact
        uses: actions/download-artifact@v4
        with:
          pattern: wbt-patched-*
          path: patched_artifact
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Verify artifact provenance and guard presence
        run: |
          set -e
          BASELINE_BZIMAGE=$(find baseline_artifact -name bzImage | head -1)
          PATCHED_BZIMAGE=$(find patched_artifact -name bzImage | head -1)
          BASELINE_VMLINUX=$(find baseline_artifact -name vmlinux | head -1)
          PATCHED_VMLINUX=$(find patched_artifact -name vmlinux | head -1)

          echo "BASELINE_BZIMAGE=$BASELINE_BZIMAGE" >> $GITHUB_ENV
          echo "PATCHED_BZIMAGE=$PATCHED_BZIMAGE"   >> $GITHUB_ENV

          echo "=== Resolved artifact paths ==="
          ls -lh "$BASELINE_BZIMAGE" "$PATCHED_BZIMAGE" "$BASELINE_VMLINUX" "$PATCHED_VMLINUX"

          echo "=== Build run provenance ==="
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ inputs.build_run_id }}" \
            | tr ',' '\n' | grep -E '"(head_sha|head_branch|status|conclusion)"' || true

          echo "=== Guard symbol gate (wbt_guard string in vmlinux) ==="
          B_CNT=$(grep -a -c 'wbt_guard' "$BASELINE_VMLINUX" || true)
          P_CNT=$(grep -a -c 'wbt_guard' "$PATCHED_VMLINUX" || true)
          echo "baseline vmlinux  wbt_guard occurrences: ${B_CNT:-0}"
          echo "patched  vmlinux  wbt_guard occurrences: ${P_CNT:-0}"
          if [ "${P_CNT:-0}" -eq 0 ]; then
            echo "FATAL: patched kernel does not contain the wbt_guard tracepoint."
            echo "       The artifact is stale/pre-guard; refusing to benchmark it."
            exit 1
          fi
          if [ "${B_CNT:-0}" -ne 0 ]; then
            echo "WARNING: baseline kernel unexpectedly contains 'wbt_guard'."
          fi

          echo "=== Applied patch diff (from patched artifact) ==="
          find patched_artifact -name 'wbt-patch-applied.diff' -exec cat {} \; | head -120 || true

          echo "=== bzImage checksums ==="
          sha256sum "$BASELINE_BZIMAGE" "$PATCHED_BZIMAGE"

      - name: Build micro-initramfs for WBT concurrent benchmark
        run: |
          rm -rf initramfs
          mkdir -p initramfs/{bin,sbin,dev,proc,sys,mnt,etc,tmp,run}
          cp /bin/busybox initramfs/bin/busybox

          # Compile native static helpers
          gcc -static -O2 -Wall benchmarks/read_latency_probe.c -o initramfs/bin/read_latency_probe
          gcc -static -O2 -Wall benchmarks/wbt_writer.c         -o initramfs/bin/wbt_writer
          chmod +x initramfs/bin/read_latency_probe initramfs/bin/wbt_writer

          # Populate essential BusyBox symlinks
          for cmd in sh ls cat echo mkdir mount umount dmesg sleep dd grep basename \
                     poweroff reboot kill sync ps head wc cut true false find \
                     sort uniq tr printf date chmod mknod zcat gzip; do
            ln -sf busybox "initramfs/bin/$cmd"
          done

          # Create /init template. Placeholders are substituted per workload
          # profile so that the identical kernel binary is measured under two
          # matched workloads: heavy mixed write/read, and read-dominated with
          # a sparse writer (the only regime that can reach LAT_UNKNOWN_WRITES
          # with read samples present).
          cat << 'EOF' > initramfs/init.template
          #!/bin/busybox sh
          export PATH=/bin:/sbin

          # Mount essential filesystems
          mount -t proc none /proc
          mount -t sysfs none /sys

          # Mount devtmpfs so /dev/zero, /dev/sda, etc. exist
          mount -t devtmpfs none /dev 2>/dev/null || true

          # Fallback: create device nodes if needed
          [ ! -e /dev/zero ] && mknod /dev/zero c 1 5
          [ ! -e /dev/null ] && mknod /dev/null c 1 3

          # Writable scratch space
          mkdir -p /tmp /run
          mount -t tmpfs none /tmp 2>/dev/null || true
          mount -t tmpfs none /run 2>/dev/null || true
          rm -f /run/stop_writer /tmp/stop_writer

          mount -t tracefs none /sys/kernel/tracing 2>/dev/null || \
          mount -t debugfs none /sys/kernel/debug 2>/dev/null || true

          echo "=========================================="
          echo "=== [QEMU-WBT] KERNEL BOOT SUCCESSFUL ==="
          echo "=== PROFILE: __PROFILE__  writers=__WRITERS__  readprocs=__READER_PROCS__ ==="
          echo "=== PARAMS: wchunk=__WCHUNK_KB__KB wwindow=__WWINDOW_MB__MB wstride=__WSTRIDE_MB__MB wsleep=__WSLEEP_MS__ms rpace=__PACE_US__us target=__WBT_LAT_USEC__us ==="
          echo "##########################################"
          uname -a

          echo "--- BLK_WBT config from /proc/config.gz ---"
          zcat /proc/config.gz 2>/dev/null | grep -E 'CONFIG_BLK_WBT' || echo "(config.gz unavailable)"

          echo "--- Block devices in /sys/block ---"
          ls /sys/block

          TARGET_DEV=""
          for b in /sys/block/*; do
            bname=$(basename "$b")
            case "$bname" in
              loop*|ram*|sr*|dm-*|zram*) continue ;;
              *) TARGET_DEV="$bname"; break ;;
            esac
          done

          if [ -z "$TARGET_DEV" ]; then
            echo "FATAL: no usable block device found"
            poweroff -f
          fi

          echo "[+] Target disk detected: /dev/$TARGET_DEV"
          echo "[i] queue/nr_requests : $(cat /sys/block/$TARGET_DEV/queue/nr_requests 2>/dev/null)"
          echo "[i] queue/rotational  : $(cat /sys/block/$TARGET_DEV/queue/rotational 2>/dev/null)"
          echo "[i] queue/scheduler   : $(cat /sys/block/$TARGET_DEV/queue/scheduler 2>/dev/null)"
          echo "[i] queue_depth (blk) : $(cat /sys/block/$TARGET_DEV/queue/queue_depth 2>/dev/null || echo 'not exposed')"

          WBT_LAT_NODE="/sys/block/$TARGET_DEV/queue/wbt_lat_usec"
          if [ -f "$WBT_LAT_NODE" ]; then
            echo "__WBT_LAT_USEC__" > "$WBT_LAT_NODE" 2>/dev/null || true
            echo "[+] Active wbt_lat_usec: $(cat $WBT_LAT_NODE)"
          else
            echo "FATAL: $WBT_LAT_NODE not present - WBT is not attached to this device"
          fi

          echo "--- Checking WBT tracepoint directory ---"
          if [ -d /sys/kernel/tracing/events/wbt ]; then
            echo "[+] /sys/kernel/tracing/events/wbt exists!"
            ls /sys/kernel/tracing/events/wbt
          else
            echo "FATAL: /sys/kernel/tracing/events/wbt missing"
          fi

          if [ -d /sys/kernel/tracing/events/wbt ]; then
            echo 0 > /sys/kernel/tracing/tracing_on
            echo "nop" > /sys/kernel/tracing/current_tracer 2>/dev/null || true
            echo "mono" > /sys/kernel/tracing/trace_clock 2>/dev/null || true
            echo "" > /sys/kernel/tracing/trace
            echo 16384 > /sys/kernel/tracing/buffer_size_kb 2>/dev/null || true
            echo 1 > /sys/kernel/tracing/events/wbt/enable
            echo 1 > /sys/kernel/tracing/tracing_on
            echo "[+] WBT tracepoints armed (buffer=$TARGET_DEV)."
          fi

          # Block-layer counters: independent proof that the workload really
          # reached the device (field 3 = read sectors, field 7 = write sectors).
          BLKSTAT_BEFORE=$(cat /sys/block/$TARGET_DEV/stat 2>/dev/null)
          echo "[BLKSTAT] before: $BLKSTAT_BEFORE"

          echo "--- Matched I/O workload on /dev/$TARGET_DEV ---"

          # Buffered writers, one per __WSTRIDE_MB__MB slice. These are what
          # arm and drive the WBT window timer.
          w=0
          while [ $w -lt __WRITERS__ ]; do
            woff=$((w * __WSTRIDE_MB__))
            /bin/wbt_writer "/dev/$TARGET_DEV" __READER_SECONDS__ "$woff" __WCHUNK_KB__ __WWINDOW_MB__ __WSLEEP_MS__ &
            w=$((w + 1))
          done

          # Concurrent O_DIRECT random 4KB readers, 8MB region each, starting at
          # 64MB. O_DIRECT is required so the probes are not answered from page
          # cache and do reach the block layer where stat[READ] is filled.
          RPIDS=""
          p=0
          while [ $p -lt __READER_PROCS__ ]; do
            start=$((64 + p * 8))
            /bin/read_latency_probe "/dev/$TARGET_DEV" "__READER_SECONDS__" "$start" 8 "__PACE_US__" &
            RPIDS="$RPIDS $!"
            p=$((p + 1))
          done

          for pid in $RPIDS; do
            wait "$pid" 2>/dev/null || true
          done

          touch /run/stop_writer
          sleep 1
          for p in $(jobs -p); do kill "$p" 2>/dev/null || true; done
          wait 2>/dev/null || true
          sleep 1

          echo 0 > /sys/kernel/tracing/tracing_on

          BLKSTAT_AFTER=$(cat /sys/block/$TARGET_DEV/stat 2>/dev/null)
          echo "[BLKSTAT] after : $BLKSTAT_AFTER"

          set -- $BLKSTAT_BEFORE; RD_BEFORE=$3; WR_BEFORE=$7
          set -- $BLKSTAT_AFTER;  RD_AFTER=$3;  WR_AFTER=$7
          echo "[BLKSTAT-DELTA] read_sectors=$((RD_AFTER - RD_BEFORE)) write_sectors=$((WR_AFTER - WR_BEFORE))"
          if [ "$((WR_AFTER - WR_BEFORE))" -eq 0 ]; then
            echo "[!] WARNING: no write sectors reached the block layer - results are not usable."
          fi
          if [ "$((RD_AFTER - RD_BEFORE))" -eq 0 ]; then
            echo "[!] WARNING: no read sectors reached the block layer - results are not usable."
          fi

          echo "=== [QEMU-WBT] EVENT COUNTS ==="
          echo "wbt_timer : $(grep -c wbt_timer /sys/kernel/tracing/trace 2>/dev/null || echo 0)"
          echo "wbt_step  : $(grep -c wbt_step  /sys/kernel/tracing/trace 2>/dev/null || echo 0)"
          echo "wbt_stat  : $(grep -c wbt_stat  /sys/kernel/tracing/trace 2>/dev/null || echo 0)"
          echo "wbt_lat   : $(grep -c wbt_lat   /sys/kernel/tracing/trace 2>/dev/null || echo 0)"
          echo "wbt_guard : $(grep -c wbt_guard /sys/kernel/tracing/trace 2>/dev/null || echo 0)"

          echo "=========================================="
          echo "=== [QEMU-WBT] CAPTURED TRACE BUFFER ==="
          echo "=========================================="
          if [ -f /sys/kernel/tracing/trace ]; then
            cat /sys/kernel/tracing/trace
          fi

          echo "=========================================="
          echo "=== [QEMU-WBT] BENCHMARK COMPLETE ==="
          echo "=========================================="
          poweroff -f
          EOF

          # The guest does not inherit the workflow environment, so every
          # tunable and every workload parameter is substituted at build time.
          build_initramfs() {
            name="$1"; writers="$2"; wchunk="$3"; wwindow="$4"; wstride="$5"; wsleep="$6"; rprocs="$7"; pace="$8"; lat="$9"
            rm -rf "rootfs_$name"
            cp -a initramfs "rootfs_$name"
            sed -i \
              -e "s|__PROFILE__|${name}|g" \
              -e "s|__WBT_LAT_USEC__|${lat}|g" \
              -e "s|__READER_SECONDS__|${READER_SECONDS}|g" \
              -e "s|__WRITERS__|${writers}|g" \
              -e "s|__WCHUNK_KB__|${wchunk}|g" \
              -e "s|__WWINDOW_MB__|${wwindow}|g" \
              -e "s|__WSTRIDE_MB__|${wstride}|g" \
              -e "s|__WSLEEP_MS__|${wsleep}|g" \
              -e "s|__READER_PROCS__|${rprocs}|g" \
              -e "s|__PACE_US__|${pace}|g" \
              "rootfs_$name/init.template"
            mv "rootfs_$name/init.template" "rootfs_$name/init"
            chmod +x "rootfs_$name/init"
            ( cd "rootfs_$name" && find . | cpio -o -H newc | gzip -9 > "../initramfs_$name.cpio.gz" )
            ls -lh "initramfs_$name.cpio.gz"
          }

          #                       name   writers chunk win stride sleep rprocs pace  lat
          build_initramfs heavy     4       64    8   8      0     2      1000  "${WBT_LAT_HEAVY}"
          build_initramfs sparse    1       4     4   4      80    6      1000  "${WBT_LAT_SPARSE}"

          echo "=== heavy profile workload lines ==="
          grep -n -E 'PROFILE:|PARAMS:|wbt_writer|read_latency_probe|wbt_lat_usec' rootfs_heavy/init || true
          echo "=== sparse profile workload lines ==="
          grep -n -E 'PROFILE:|PARAMS:|wbt_writer|read_latency_probe|wbt_lat_usec' rootfs_sparse/init || true

      - name: Create fresh disposable virtual disks
        run: |
          # 128MB disk: upper 64MB prefilled with random data for the read probe.
          # Writers are confined to the first 32MB, so the read region stays
          # byte-identical between the baseline and patched runs.
          dd if=/dev/zero of=baseline_disk.img bs=1M count=128
          dd if=/dev/urandom of=baseline_disk.img bs=1M seek=64 count=64 conv=notrunc

          dd if=/dev/zero of=patched_disk.img bs=1M count=128
          dd if=/dev/urandom of=patched_disk.img bs=1M seek=64 count=64 conv=notrunc

          sha256sum baseline_disk.img patched_disk.img

      - name: Run matched benchmark — 8 configurations
        run: |
          run_bench() {
            label="$1"; kern="$2"; img="$3"; initrd="$4"; driveargs="$5"; ctrl="$6"
            echo "::group::QEMU $label"
            timeout 300s qemu-system-x86_64 ${ACCEL} -m 1024 \
              -kernel "$kern" -initrd "$initrd" \
              -drive "file=$img,format=raw,${driveargs}" ${ctrl} \
              -append "console=ttyS0 panic=1 quiet loglevel=3" \
              -nographic -no-reboot 2>&1 | tee "${label}_qemu.log" || true
            echo "::endgroup::"
          }

          VIOARGS="if=none,id=hd0,cache=none,aio=threads"
          # num_queues=1 keeps the virtio-scsi transport single-queue so the
          # WBT accounting model matches the one being reasoned about.
          VIOCTRL="-device virtio-scsi-pci,id=scsi0,num_queues=1 -device scsi-hd,bus=scsi0.0,drive=hd0"

          # ---- Profile A: heavy mixed write/read -------------------------
          # ide   : QD==1 control -> scale_up() has no depth lever
          # virtio: deep queue   -> scale_up()/hold actually differ
          run_bench baseline_ide_h "$BASELINE_BZIMAGE" baseline_disk.img initramfs_heavy.cpio.gz  "if=ide"  ""
          run_bench patched_ide_h  "$PATCHED_BZIMAGE"  patched_disk.img  initramfs_heavy.cpio.gz  "if=ide"  ""
          run_bench baseline_vio_h "$BASELINE_BZIMAGE" baseline_disk.img initramfs_heavy.cpio.gz  "${VIOARGS}" "${VIOCTRL}"
          run_bench patched_vio_h  "$PATCHED_BZIMAGE"  patched_disk.img  initramfs_heavy.cpio.gz  "${VIOARGS}" "${VIOCTRL}"

          # ---- Profile B: read-dominated + sparse writer ------------------
          # The only regime that can reach LAT_UNKNOWN_WRITES with read samples
          # present, i.e. the only regime where the guard can fire at all.
          run_bench baseline_ide_s "$BASELINE_BZIMAGE" baseline_disk.img initramfs_sparse.cpio.gz "if=ide"  ""
          run_bench patched_ide_s  "$PATCHED_BZIMAGE"  patched_disk.img  initramfs_sparse.cpio.gz "if=ide"  ""
          run_bench baseline_vio_s "$BASELINE_BZIMAGE" baseline_disk.img initramfs_sparse.cpio.gz "${VIOARGS}" "${VIOCTRL}"
          run_bench patched_vio_s  "$PATCHED_BZIMAGE"  patched_disk.img  initramfs_sparse.cpio.gz "${VIOARGS}" "${VIOCTRL}"

      - name: Analyze benchmark results
        run: |
          mkdir -p benchmarks/smoke_test
          cp *_qemu.log benchmarks/smoke_test/

          for label in baseline_ide_h patched_ide_h baseline_vio_h patched_vio_h \
                       baseline_ide_s patched_ide_s baseline_vio_s patched_vio_s; do
            echo "## Ftrace WBT Evaluation: ${label}" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            python3 ftrace_wbt_tracer.py analyze "${label}_qemu.log" \
              | tee "${label}_analysis.txt" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "=================== ${label} ANALYSIS ==================="
            cat "${label}_analysis.txt"
          done

      - name: Commit benchmark logs to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/smoke_test/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(ci): record matched QEMU benchmark logs (ide + virtio-scsi) [skip ci]"
            git push origin HEAD || true
          fi

      - name: Upload QEMU benchmark logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-matched-benchmark-logs
          retention-days: 14
          path: |
            *_qemu.log
            *_analysis.txt
