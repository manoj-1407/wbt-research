name: "QEMU WBT Concurrent Benchmark — Matched Workload & Guard Audit"

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run ID of build-wbt-kernels to fetch artifacts from"
        required: true
        default: "39987714631"

permissions:
  contents: write
  actions: read

jobs:
  qemu-concurrent-benchmark:
    name: "QEMU Benchmark: Matched Concurrent Read/Write & Guard Audit"
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out research repo
        uses: actions/checkout@v4

      - name: Check runner capabilities & virtualization
        run: |
          echo "=== CPU Info ==="
          grep -m 1 'model name' /proc/cpuinfo || true
          echo "=== KVM availability ==="
          if [ -e /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM is available and writable: /dev/kvm"
            echo "ACCEL=-enable-kvm -cpu host" >> $GITHUB_ENV
          else
            echo "KVM not available; using TCG emulation: -accel tcg"
            echo "ACCEL=-accel tcg" >> $GITHUB_ENV
          fi

      - name: Install QEMU and userspace tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 busybox-static cpio build-essential

      - name: Download Baseline Artifact
        uses: actions/download-artifact@v4
        with:
          name: wbt-baseline-a07f9ea8a
          path: baseline_artifact
          run-id: ${{ github.event.inputs.build_run_id || '39987714631' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Download Patched Artifact
        uses: actions/download-artifact@v4
        with:
          name: wbt-patched-a07f9ea8a
          path: patched_artifact
          run-id: ${{ github.event.inputs.build_run_id || '39987714631' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Inspect downloaded kernel binaries
        run: |
          echo "Baseline bzImage:"
          ls -lh baseline_artifact/kernel-src/arch/x86/boot/bzImage
          echo "Patched bzImage:"
          ls -lh patched_artifact/kernel-src/arch/x86/boot/bzImage

      - name: Build micro-initramfs for WBT concurrent benchmark
        run: |
          mkdir -p initramfs/{bin,sbin,dev,proc,sys,mnt,etc}
          cp /bin/busybox initramfs/bin/busybox
          
          # Compile native static read latency probe
          gcc -static -O2 benchmarks/read_latency_probe.c -o initramfs/bin/read_latency_probe
          chmod +x initramfs/bin/read_latency_probe

          # Populate essential BusyBox symlinks
          for cmd in sh ls cat echo mkdir mount umount dmesg sleep dd grep basename poweroff reboot kill; do
            ln -sf busybox "initramfs/bin/$cmd"
          done

          # Create /init script
          cat << 'EOF' > initramfs/init
          #!/bin/busybox sh
          export PATH=/bin:/sbin

          # Mount essential filesystems
          mount -t proc none /proc
          mount -t sysfs none /sys

          # Mount devtmpfs so /dev/zero, /dev/sda, etc. exist
          mount -t devtmpfs none /dev 2>/dev/null || true

          # Fallback: create device nodes if needed
          [ ! -e /dev/zero ] && mknod /dev/zero c 1 5
          [ ! -e /dev/null ] && mknod /dev/null c 1 3

          mount -t tracefs none /sys/kernel/tracing 2>/dev/null || \
          mount -t debugfs none /sys/kernel/debug 2>/dev/null || true

          echo "=========================================="
          echo "=== [QEMU-WBT] KERNEL BOOT SUCCESSFUL ==="
          echo "=========================================="
          uname -a

          TARGET_DEV=""
          for b in /sys/block/*; do
            bname=$(basename "$b")
            case "$bname" in
              loop*|ram*) continue ;;
              *) TARGET_DEV="$bname"; break ;;
            esac
          done

          if [ -n "$TARGET_DEV" ]; then
            echo "[+] Target disk detected: /dev/$TARGET_DEV"
            WBT_LAT_NODE="/sys/block/$TARGET_DEV/queue/wbt_lat_usec"
            if [ -f "$WBT_LAT_NODE" ]; then
              # Set WBT target latency to 20,000 us (20ms) for controlled evaluation
              echo "20000" > "$WBT_LAT_NODE" 2>/dev/null || true
              echo "[+] Active wbt_lat_usec: $(cat $WBT_LAT_NODE)"
            fi
          fi

          if [ -d /sys/kernel/tracing/events/wbt ]; then
            echo 0 > /sys/kernel/tracing/tracing_on
            echo "" > /sys/kernel/tracing/trace
            echo 1 > /sys/kernel/tracing/events/wbt/enable
            echo 1 > /sys/kernel/tracing/tracing_on
            echo "[+] WBT tracepoints armed."
          fi

          if [ -n "$TARGET_DEV" ]; then
            echo "--- Starting Matched Concurrent Workload on /dev/$TARGET_DEV ---"
            
            # 1. Background streaming direct writer to first 64MB of disk
            (
              while [ ! -f /tmp/stop_writer ]; do
                dd if=/dev/zero of="/dev/$TARGET_DEV" bs=64k count=50 seek=0 oflag=direct conv=fsync 2>/dev/null || true
                sleep 0.05 2>/dev/null || true
              done
            ) &
            WRITER_PID=$!

            # 2. Foreground random 4KB read prober targeting 64MB..128MB region for 15 seconds
            /bin/read_latency_probe "/dev/$TARGET_DEV" 15 64 64

            # 3. Stop background writer
            touch /tmp/stop_writer
            wait $WRITER_PID 2>/dev/null || true
            sleep 1
          fi

          echo "=========================================="
          echo "=== [QEMU-WBT] CAPTURED TRACE BUFFER ==="
          echo "=========================================="
          if [ -f /sys/kernel/tracing/trace ]; then
            cat /sys/kernel/tracing/trace
          fi

          echo "=========================================="
          echo "=== [QEMU-WBT] BENCHMARK COMPLETE ==="
          echo "=========================================="
          poweroff -f
          EOF

          chmod +x initramfs/init

          # Package initramfs
          cd initramfs
          find . | cpio -o -H newc | gzip -9 > ../initramfs.cpio.gz
          cd ..
          ls -lh initramfs.cpio.gz

      - name: Create fresh disposable virtual disks
        run: |
          # 128MB baseline disk: prefill upper 64MB with random data for read probe
          dd if=/dev/zero of=baseline_disk.img bs=1M count=128
          dd if=/dev/urandom of=baseline_disk.img bs=1M seek=64 count=64 conv=notrunc

          # 128MB patched disk: identical initial structure
          dd if=/dev/zero of=patched_disk.img bs=1M count=128
          dd if=/dev/urandom of=patched_disk.img bs=1M seek=64 count=64 conv=notrunc

      - name: Run Concurrent Benchmark — Baseline Kernel
        run: |
          echo "Booting baseline kernel with baseline_disk.img..."
          timeout 120s qemu-system-x86_64 \
            $ACCEL \
            -m 1024 \
            -kernel baseline_artifact/kernel-src/arch/x86/boot/bzImage \
            -initrd initramfs.cpio.gz \
            -drive file=baseline_disk.img,format=raw,if=ide \
            -append "console=ttyS0 panic=1 quiet loglevel=3" \
            -nographic \
            -no-reboot 2>&1 | tee baseline_qemu.log || true

      - name: Run Concurrent Benchmark — Patched Kernel
        run: |
          echo "Booting patched kernel with patched_disk.img..."
          timeout 120s qemu-system-x86_64 \
            $ACCEL \
            -m 1024 \
            -kernel patched_artifact/kernel-src/arch/x86/boot/bzImage \
            -initrd initramfs.cpio.gz \
            -drive file=patched_disk.img,format=raw,if=ide \
            -append "console=ttyS0 panic=1 quiet loglevel=3" \
            -nographic \
            -no-reboot 2>&1 | tee patched_qemu.log || true

      - name: Display and analyze benchmark results
        run: |
          mkdir -p benchmarks/smoke_test
          cp baseline_qemu.log benchmarks/smoke_test/
          cp patched_qemu.log benchmarks/smoke_test/

          echo "## Ftrace WBT Evaluation: Baseline" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          python3 ftrace_wbt_tracer.py analyze baseline_qemu.log | tee baseline_analysis.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "## Ftrace WBT Evaluation: Patched (Hold-Depth)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          python3 ftrace_wbt_tracer.py analyze patched_qemu.log | tee patched_analysis.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "=================== BASELINE ANALYSIS ==================="
          cat baseline_analysis.txt
          echo "=================== PATCHED ANALYSIS ==================="
          cat patched_analysis.txt

      - name: Commit benchmark logs to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/smoke_test/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(ci): record concurrent benchmark logs from QEMU [skip ci]"
            git push origin HEAD || true
          fi

      - name: Upload QEMU benchmark logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-concurrent-benchmark-logs
          retention-days: 14
          path: |
            baseline_qemu.log
            patched_qemu.log
            baseline_analysis.txt
            patched_analysis.txt
